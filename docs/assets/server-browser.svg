<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated server browser screenshot</title>
  <desc id="desc">A mock screenshot of the Lucid Blocks multiplayer server tab with a named server card and no visible raw address or port.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10101a"/>
      <stop offset="0.55" stop-color="#171526"/>
      <stop offset="1" stop-color="#241528"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.38">
    <rect x="92" y="84" width="34" height="34" fill="#79e0b2"/>
    <rect x="1134" y="122" width="18" height="18" fill="#ff6a8a"/>
    <rect x="1048" y="580" width="26" height="26" fill="#65b7ff"/>
    <rect x="174" y="610" width="18" height="18" fill="#f1d47a"/>
    <rect x="998" y="92" width="10" height="10" fill="#79e0b2"/>
  </g>
  <rect x="96" y="76" width="1088" height="568" rx="8" fill="#191822" stroke="#40385a" stroke-width="2" filter="url(#soft)"/>
  <rect x="96" y="76" width="1088" height="64" rx="8" fill="#252134"/>
  <text x="132" y="118" font-family="Verdana, Arial, sans-serif" font-size="28" fill="#f1e7d0">Lucid Blocks Multiplayer</text>
  <g font-family="Verdana, Arial, sans-serif" font-size="20">
    <rect x="132" y="164" width="132" height="42" rx="4" fill="#3f365e"/>
    <text x="166" y="192" fill="#fff8df">Servers</text>
    <text x="300" y="192" fill="#8f88a8">LAN</text>
    <text x="380" y="192" fill="#8f88a8">Steam</text>
  </g>
  <rect x="132" y="238" width="1016" height="156" rx="6" fill="#242332" stroke="#62578e" stroke-width="2"/>
  <rect x="156" y="262" width="108" height="108" rx="4" fill="#0f1119" stroke="#89e6c3" stroke-width="2"/>
  <rect x="180" y="286" width="22" height="22" fill="#89e6c3"/>
  <rect x="218" y="286" width="22" height="22" fill="#e6d282"/>
  <rect x="180" y="324" width="22" height="22" fill="#d36f8e"/>
  <rect x="218" y="324" width="22" height="22" fill="#7eb6ff"/>
  <text x="300" y="296" font-family="Verdana, Arial, sans-serif" font-size="34" fill="#fff5dd">QUALIA</text>
  <text x="300" y="334" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#8fe8c4">online</text>
  <text x="390" y="334" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#bfb8d8">2 / 4 players</text>
  <text x="300" y="366" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#918ca7">Server address is hidden in the public UI</text>
  <rect x="936" y="286" width="160" height="60" rx="5" fill="#8fe8c4"/>
  <text x="974" y="324" font-family="Verdana, Arial, sans-serif" font-size="22" fill="#102119">Join</text>
  <rect x="132" y="432" width="1016" height="86" rx="6" fill="#20202b" stroke="#40385a" stroke-width="2"/>
  <text x="164" y="468" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#d5cfea">Friend server names can be added later by manifest/config.</text>
  <text x="164" y="498" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#8f88a8">No private IPs or raw ports in the README.</text>
</svg>
